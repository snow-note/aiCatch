<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1d2b3a" />
    <title>AI CATCH</title>
  </head>
  <body>
    <main id="stage">
      <div id="console" data-testid="console">
        <h1 class="brand">AI CATCH</h1>
        <div class="bezel">
          <canvas
            id="screen"
            data-testid="game-canvas"
            width="240"
            height="160"
            aria-hidden="true"
          ></canvas>
        </div>
        <div class="controls">
          <div class="hint">&#9664; &#9654; MOVE</div>
          <button type="button" id="start-button" data-testid="start-button" class="btn">START</button>
        </div>
      </div>
      <div
        id="announcer"
        class="visually-hidden"
        role="status"
        aria-live="polite"
        data-testid="announcer"
      ></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
